<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>シフトスケジュール</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E9E6DF;
            --text-color: #2B241E;
            --text-light: #7A7067;
            --accent-gold: #9E876E;
            --accent-gold-light: #F4F1EA;
            --card-bg: #FFFFFF;
            --border-color: #D6D0C5;
            --sunday-color: #C86D63;
            --sunday-bg: #FDF4F3;
            --saturday-color: #5B7A94;
            --saturday-bg: #F3F6F9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Shippori Mincho', serif;
            font-weight: 400;
            line-height: 1.6;
            letter-spacing: 0.05em;
            padding-bottom: 40px;
        }

        header {
            padding: 32px 20px 20px;
            text-align: center;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }

        .store-badge {
            display: inline-block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 3px 12px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            color: var(--text-color);
            margin-bottom: 4px;
        }

        .subtitle {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            color: var(--text-light);
            letter-spacing: 0.1em;
        }

        .container {
            max-width: 100%;
            padding: 16px 12px;
        }

        .filter-section {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 16px;
            scrollbar-width: none;
        }
        .filter-section::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 7px 14px;
            font-family: 'Shippori Mincho', serif;
            font-size: 0.8rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background-color: var(--accent-gold);
            color: #FFFFFF;
            border-color: var(--accent-gold);
        }

        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 8px rgba(43, 36, 30, 0.03);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .table-header-info {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--accent-gold-light);
        }

        .table-title {
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.1em;
        }

        .month-display {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1rem;
            color: var(--accent-gold);
            font-weight: 500;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            white-space: nowrap;
            font-size: 0.8rem;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 8px 4px;
            vertical-align: middle;
        }

        th.staff-col, td.staff-col {
            position: sticky;
            left: 0;
            background-color: var(--card-bg);
            z-index: 2;
            min-width: 105px;
            max-width: 105px;
            text-align: left;
            padding-left: 10px;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        th.staff-col {
            background-color: var(--accent-gold);
            color: #FFFFFF;
            z-index: 3;
            border-color: var(--accent-gold);
        }

        th.date-th {
            background-color: var(--accent-gold);
            color: #FFFFFF;
            font-weight: 400;
            min-width: 38px;
            border-color: var(--accent-gold);
        }

        th.date-th.sun {
            background-color: #B85B52;
        }

        th.date-th.sat {
            background-color: #4A6782;
        }

        .date-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            display: block;
            line-height: 1.1;
        }

        .date-day {
            font-size: 0.65rem;
            display: block;
            opacity: 0.9;
        }

        td.sun-cell {
            background-color: var(--sunday-bg);
            color: var(--sunday-color);
        }

        td.sat-cell {
            background-color: var(--saturday-bg);
            color: var(--saturday-color);
        }

        .shift-mark {
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--accent-gold);
        }

        .shift-time {
            font-size: 0.65rem;
            line-height: 1.2;
            display: block;
            color: var(--text-color);
            font-family: 'Cormorant Garamond', serif;
        }

        .shift-off {
            color: #CCC6BD;
            font-size: 0.75rem;
        }

        footer {
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-light);
            margin-top: 24px;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <header>
        <div class="store-badge" id="store-badge-text">Nagoya Sakae</div>
        <h1 id="main-title">出演スケジュール</h1>
        <div class="subtitle" id="current-month-sub"></div>
    </header>

    <div class="container">
        <div class="filter-section" id="filter-tabs"></div>

        <div class="table-card">
            <div class="table-header-info">
                <span class="table-title">シフト一覧</span>
                <span class="month-display" id="month-title"></span>
            </div>
            <div class="table-responsive">
                <table id="shift-table"></table>
            </div>
        </div>
    </div>

    <footer>
        <span id="footer-text">&copy; 羅心盤 名古屋栄店</span>
    </footer>

    <script>
        // ==========================================
        // 【設定エリア】スプレッドシート連携版
        // ==========================================
        const STORE_NAME = "名古屋栄店";
        const YEAR = 2026;
        const MONTH = 11; // 読み込みたい月（タブ名と連動）

        // shift
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwu3A4mKCh9FucYJ7AKbokUCrZlLevAnwFIGtUJyL2soC2Eh_2UcxPycSQSmOv2c1nu/exec";

        let STAFF_LIST = [];

        async function fetchShiftData() {
            try {
                // スプレッドシートのタブ名（例: 11月）を指定してデータを取得
                const response = await fetch(`${GAS_API_URL}?month=${MONTH}月`);
                STAFF_LIST = await response.json();
                renderApp();
            } catch (error) {
                console.error("シフトデータの取得に失敗しました", error);
            }
        }

        let currentFilter = "all";

        function getDaysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }

        function getDayOfWeek(year, month, day) {
            const daysOfWeek = ['日', '月', '火', '水', '木', '金', '土'];
            const date = new Date(year, month - 1, day);
            return {
                dayName: daysOfWeek[date.getDay()],
                dayIndex: date.getDay()
            };
        }

        function renderApp() {
            document.getElementById('store-badge-text').textContent = STORE_NAME;
            document.getElementById('current-month-sub').textContent = `${YEAR} . ${String(MONTH).padStart(2, '0')}`;
            document.getElementById('month-title').textContent = `${YEAR}年${MONTH}月`;
            document.getElementById('footer-text').innerHTML = `&copy; 羅心盤 ${STORE_NAME}`;

            const daysCount = getDaysInMonth(YEAR, MONTH);
            
            const tabsContainer = document.getElementById('filter-tabs');
            tabsContainer.innerHTML = `<button class="filter-btn ${currentFilter === 'all' ? 'active' : ''}" onclick="setFilter('all')">全員</button>`;
            STAFF_LIST.forEach(staff => {
                const activeClass = currentFilter === staff.name ? 'active' : '';
                tabsContainer.innerHTML += `<button class="filter-btn ${activeClass}" onclick="setFilter('${staff.name}')">${staff.name}</button>`;
            });

            const table = document.getElementById('shift-table');
            let headerHtml = '<thead><tr><th class="staff-col">占い師</th>';
            for (let d = 1; d <= daysCount; d++) {
                const dayInfo = getDayOfWeek(YEAR, MONTH, d);
                let thClass = 'date-th';
                if (dayInfo.dayIndex === 0) thClass += ' sun';
                if (dayInfo.dayIndex === 6) thClass += ' sat';
                headerHtml += `<th class="${thClass}"><span class="date-num">${d}</span><span class="date-day">(${dayInfo.dayName})</span></th>`;
            }
            headerHtml += '</tr></thead>';

            let bodyHtml = '<tbody>';
            const filteredStaff = currentFilter === 'all' ? STAFF_LIST : STAFF_LIST.filter(s => s.name === currentFilter);

            filteredStaff.forEach(staff => {
                bodyHtml += `<tr><td class="staff-col">${staff.name}</td>`;
                for (let d = 1; d <= daysCount; d++) {
                    const dayInfo = getDayOfWeek(YEAR, MONTH, d);
                    let tdClass = '';
                    if (dayInfo.dayIndex === 0) tdClass = 'sun-cell';
                    if (dayInfo.dayIndex === 6) tdClass = 'sat-cell';

                    const matchedDay = staff.days.find(item => {
                        return Number(item.day) === d;
                    });

                    let cellContent = '<span class="shift-off">-</span>';
                    if (matchedDay !== undefined) {
                        if (matchedDay.label) {
                            cellContent = `<span class="shift-time">${matchedDay.label}</span>`;
                        } else {
                            cellContent = '<span class="shift-mark">◯</span>';
                        }
                    }
                    bodyHtml += `<td class="${tdClass}">${cellContent}</td>`;
                }
                bodyHtml += '</tr>';
            });
            bodyHtml += '</tbody>';

            table.innerHTML = headerHtml + bodyHtml;
        }

        function setFilter(staffName) {
            currentFilter = staffName;
            renderApp();
        }

        // 起動時にスプレッドシートからデータを取得
        fetchShiftData();
    </script>
</body>
</html>
