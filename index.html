<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="robots" content="noindex, nofollow">
    <title>出演スケジュール | 羅心盤 名古屋栄店</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@500;600;700&family=Shippori+Mincho:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E9E6DF;
            --text-color: #2B241E;
            --text-light: #7A7067;
            --accent-gold: #9E876E;
            --accent-gold-light: #F4F1EA;
            --card-bg: #FFFFFF;
            --border-color: #D6D0C5;
            /* 土日のカラー：赤青を使わず、ゴールドを薄くした上品なトーンに変更 */
            --weekend-color: #8C7861;
            --weekend-bg: #F5F3EE;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Shippori Mincho', serif;
            font-weight: 500; /* 老眼の方でも見やすいよう少しウェイトをアップ */
            line-height: 1.7;
            letter-spacing: 0.06em;
            padding-bottom: 40px;
        }

        header {
            padding: 36px 20px 24px;
            text-align: center;
            background-color: var(--bg-color);
            border-bottom: 1px solid var(--border-color);
        }

        .store-badge {
            display: inline-block;
            font-family: 'Cormorant Garamond', serif;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.35em;
            padding: 5px 16px 4px 20px; /* letter-spacingの右余白を考慮して中央揃え */
            margin-bottom: 14px;
            text-transform: uppercase;
            background-color: var(--accent-gold);
            color: #FAF8F5;
            border: 1px solid var(--accent-gold);
            box-shadow: 0 2px 8px rgba(158, 135, 110, 0.25);
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            color: var(--accent-gold);
            line-height: 1.5;
            margin-bottom: 0;
        }

        .store-title-sub {
            display: block;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.2em;
            margin-bottom: 2px;
            opacity: 0.95;
        }

        .container {
            max-width: 100%;
            padding: 20px 12px;
        }

        .table-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 12px rgba(43, 36, 30, 0.04);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .table-header-info {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--accent-gold-light);
        }

        .table-title {
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 0.1em;
            color: var(--accent-gold);
        }

        .month-display {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 1.15rem;
            color: var(--accent-gold);
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            white-space: nowrap;
            font-size: 0.9rem; /* 視認性を上げるため文字サイズを少し拡大 */
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px 8px; /* タップしやすくするため高さを確保 */
            vertical-align: middle;
        }

        th.staff-col, td.staff-col {
            position: sticky;
            left: 0;
            background-color: var(--card-bg);
            z-index: 2;
            min-width: 120px;
            max-width: 120px;
            text-align: left;
            padding-left: 12px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        td.staff-col {
            color: var(--text-color);
        }

        th.staff-col {
            background-color: var(--accent-gold);
            color: #FFFFFF;
            z-index: 3;
            border-color: var(--accent-gold);
            font-size: 0.95rem;
        }

        th.date-th {
            background-color: var(--accent-gold);
            color: #FFFFFF;
            font-weight: 500;
            min-width: 48px;
            border-color: var(--accent-gold);
        }

        th.date-th.weekend {
            background-color: #8C7861;
        }

        .date-num {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 1.05rem;
            font-weight: 600;
            display: block;
            line-height: 1.2;
        }

        .date-day {
            font-size: 0.75rem;
            display: block;
            opacity: 0.95;
        }

        /* 土日のセル：薄いゴールドベージュ */
        td.weekend-cell {
            background-color: var(--weekend-bg);
            color: var(--weekend-color);
        }

        .shift-mark {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-color);
        }

        .shift-time {
            font-size: 0.95rem;
            line-height: 1.3;
            display: block;
            color: var(--text-color);
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 600;
        }

        .shift-off {
            color: #B5AEA4;
            font-size: 0.85rem;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 30px;
            letter-spacing: 0.1em;
        }
    </style>
</head>
<body>

    <header>
        <div class="store-badge">RASHINBAN</div>
        <h1 id="main-title">
            <span class="store-title-sub">名古屋栄店</span>
            出演スケジュール
        </h1>
    </header>

    <div class="container">
        <div class="table-card">
            <div class="table-header-info">
                <span class="table-title">シフト一覧</span>
                <span class="month-display" id="month-title"></span>
            </div>
            <div class="table-responsive">
                <table id="shift-table"></table>
            </div>
        </div>
    </div>

    <footer>
        <span id="footer-text">&copy; 羅心盤 名古屋栄店</span>
    </footer>

    <script>
        // ==========================================
        // 【設定エリア】スプレッドシート連携版
        // ==========================================
        const STORE_NAME = "名古屋栄店";
        const YEAR = 2026;
        const MONTH = 11; // 読み込みたい月（タブ名と連動）

        // shift
        const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwu3A4mKCh9FucYJ7AKbokUCrZlLevAnwFIGtUJyL2soC2Eh_2UcxPycSQSmOv2c1nu/exec";


        let STAFF_LIST = [];

        async function fetchShiftData() {
            try {
                const response = await fetch(`${GAS_API_URL}?month=${MONTH}月`);
                STAFF_LIST = await response.json();
                renderApp();
            } catch (error) {
                console.error("シフトデータの取得に失敗しました", error);
            }
        }

        function getDaysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }

        function getDayOfWeek(year, month, day) {
            const daysOfWeek = ['日', '月', '火', '水', '木', '金', '土'];
            const date = new Date(year, month - 1, day);
            return {
                dayName: daysOfWeek[date.getDay()],
                dayIndex: date.getDay()
            };
        }

        function renderApp() {
            document.getElementById('month-title').textContent = `${YEAR}年${MONTH}月`;
            document.getElementById('footer-text').innerHTML = `&copy; 羅心盤 ${STORE_NAME}`;

            const daysCount = getDaysInMonth(YEAR, MONTH);
            const table = document.getElementById('shift-table');
            
            let headerHtml = '<thead><tr><th class="staff-col">占い師</th>';
            for (let d = 1; d <= daysCount; d++) {
                const dayInfo = getDayOfWeek(YEAR, MONTH, d);
                let thClass = 'date-th';
                // 土曜(6)または日曜(0)の場合
                if (dayInfo.dayIndex === 0 || dayInfo.dayIndex === 6) {
                    thClass += ' weekend';
                }
                headerHtml += `<th class="${thClass}"><span class="date-num">${d}</span><span class="date-day">(${dayInfo.dayName})</span></th>`;
            }
            headerHtml += '</tr></thead>';

            let bodyHtml = '<tbody>';
            STAFF_LIST.forEach(staff => {
                bodyHtml += `<tr><td class="staff-col">${staff.name}</td>`;
                for (let d = 1; d <= daysCount; d++) {
                    const dayInfo = getDayOfWeek(YEAR, MONTH, d);
                    let tdClass = '';
                    if (dayInfo.dayIndex === 0 || dayInfo.dayIndex === 6) {
                        tdClass = 'weekend-cell';
                    }

                    const matchedDay = staff.days.find(item => {
                        return Number(item.day) === d;
                    });

                    let cellContent = '<span class="shift-off">-</span>';
                    if (matchedDay !== undefined) {
                        if (matchedDay.label) {
                            cellContent = `<span class="shift-time">${matchedDay.label}</span>`;
                        } else {
                            cellContent = '<span class="shift-mark">◯</span>';
                        }
                    }
                    bodyHtml += `<td class="${tdClass}">${cellContent}</td>`;
                }
                bodyHtml += '</tr>';
            });
            bodyHtml += '</tbody>';

            table.innerHTML = headerHtml + bodyHtml;
        }

        // 起動時にスプレッドシートからデータを取得
        fetchShiftData();
    </script>
</body>
</html>
